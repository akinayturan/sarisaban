<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
  <a class="skip" href="#icerik">İçeriğe geç</a>
  <header class="header">
    <div class="shell masthead">
      <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <nav aria-label="Ana menü">
        {{ range site.Menus.main }}
          <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  <main id="icerik">{{ block "main" . }}{{ end }}</main>
  <footer class="footer">
    <div class="shell footer-inner">
      <div><a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a><p>Chrysoupoli · Nestos · Kavala</p></div>
      <nav aria-label="Arşiv bağlantıları">
        <a href="{{ (site.GetPage "/kaynakca").RelPermalink }}">Kaynakça</a>
        <a href="https://gumushacikoy.pages.dev/">Gümüşhacıköy Hafızası</a>
      </nav>
    </div>
  </footer>
</body>
</html>
